{id:"g_leather_diy",emoji:"👜",name:"亲手做一只皮具（手作课）",why:"一整天，从裁皮、打孔到缝线全是自己来。针脚不齐的地方反而最像礼物，因为那是机器不会犯的错。",priceLow:380,priceHigh:800,category:"定制",traits:[b.MINIMAL,b.ART],occasions:[f.BIRTH,f.ANNIV,f.MILE],recipients:[h.BF,h.GF,h.FRIEND,h.WORK],leadDays:7,tags:["一起完成","手作","低调"],tip:"选卡包或钥匙扣这类小件，四小时能做完；提前问清是否含皮料费和刻字。",avoid:[]},{id:"g_embroider_cap",emoji:"🧢",name:"手工刺绣的棒球帽",why:"帽檐下面绣一句只有你们懂的短语。别人看只是个图案，他一低头就知道那行字写的是什么，戴出去也不张扬。",priceLow:120,priceHigh:300,category:"定制",traits:[b.FASHION,b.ART],occasions:[f.BIRTH,f.NOREASON,f.MILE],recipients:[h.BF,h.GF,h.FRIEND,h.KID],leadDays:7,tags:["可刻字","有梗","日常在用"],tip:"找接单的刺绣工作室，图案控制在五厘米内；深色帽配米白线最耐看。",avoid:[ve.LOUD]},{id:"g_family_recipe",emoji:"🍲",name:"把家里的菜谱做成一本册子",why:"让爸妈口述，你记下火候和分量，再配上成品照印成册。以后就算他们不下厨，那个味道也不会失传。",priceLow:180,priceHigh:460,category:"定制",traits:[b.COOK,b.HOME],occasions:[f.FEST,f.BIRTH,f.NOREASON,f.MILE],recipients:[h.PARENT,h.FRIEND],leadDays:14,tags:["为父母","可珍藏","独一无二"],tip:"先用手机录一次做菜全程再整理，十道菜足够；小开本骑马钉，方便摊在灶台边。",avoid:[]},{id:"g_seal_stamp",emoji:"🔏",name:"一枚刻名字的手工印章",why:"石头是自己挑的，边款还能刻一句短话。写完东西盖一下，日常的字就忽然有了落款，这种东西一旦用上就很难换掉。",priceLow:200,priceHigh:560,category:"定制",traits:[b.ART,b.MINIMAL],occasions:[f.MILE,f.BIRTH,f.FEST],recipients:[h.WORK,h.PARENT,h.FRIEND,h.KID],leadDays:14,tags:["低调","可刻字","可珍藏"],tip:"找篆刻师傅按字数计价，青田石入门友好；配一盒朱砂印泥一起送才算完整。",avoid:[]},{id:"g_time_capsule",emoji:"📦",name:"给未来的时间胶囊盒",why:"你们各写一封信封起来，约好五年后一起拆。盒子本身没什么用，有用的是那句「五年后还一起拆」。",priceLow:80,priceHigh:260,category:"定制",traits:[b.ART,b.HOME],occasions:[f.ANNIV,f.MILE,f.BIRTH,f.SORRY],recipients:[h.GF,h.BF,h.FRIEND,h.KID],leadDays:3,tags:["有仪式感","手作","独一无二"],tip:"买带锁的铁盒，写上开启日期贴封条；把当年的电影票、地铁卡也一起塞进去。",avoid:[]},{id:"g_cookie_message",emoji:"🍪",name:"写着一句话的手工曲奇礼盒",why:"糖霜上是一行短句，分量不大，也不需要对方回礼。放在工位上，是一份刚好不越界的好意。",priceLow:80,priceHigh:200,category:"定制",traits:[b.SWEET,b.COOK],occasions:[f.FEST,f.BIRTH,f.MILE,f.NOREASON],recipients:[h.WORK,h.FRIEND,h.KID,h.PARENT],leadDays:3,tags:["低调","甜","不越界"],tip:"找可写字的手作烘焙工作室，提前三天下单；单盒分装比大盒更方便分给同事。",avoid:[ve.FOOD,ve.DISPOSABLE]},{id:"g_oil_portrait",emoji:"🖌️",name:"手绘布面肖像油画",why:"画师照着照片画上一个月，笔触是能摸出来的。挂上墙之后，它会变成这个家里最不容易被搬走的一件东西。",priceLow:1500,priceHigh:4e3,category:"定制",traits:[b.ART,b.HOME],occasions:[f.ANNIV,f.MILE,f.BIRTH,f.FEST],recipients:[h.PARENT,h.GF,h.BF,h.FRIEND],leadDays:30,tags:["独一无二","可上墙","可珍藏"],tip:"提前一个月约画师，尺寸别小于 40×50；提供光线均匀的正面照，成片才不会像证件照。",avoid:[ve.PRICEY,ve.BULKY]},{id:"g_pottery",emoji:"🏺",name:"陶艺拉坯双人课",why:"泥在手里塌下去再重新立起来，两个小时基本说不了几句话。烧出来的杯子多半是歪的，但之后每天都会拿它喝水。",priceLow:260,priceHigh:520,category:"体验",traits:[b.ART,b.HOME],occasions:[f.BIRTH,f.ANNIV,f.NOREASON,f.SORRY],recipients:[h.GF,h.BF,h.FRIEND,h.KID],leadDays:3,tags:["一起完成","手作","不占地方"],tip:"提前约周末场，烧制还要两三周才能取；问清是否含釉色和成品邮寄。",avoid:[]},{id:"g_darkroom",emoji:"📷",name:"银盐暗房冲洗体验",why:"红灯底下看着影子从白纸里慢慢浮出来，那几秒是数码拍照给不了的。冲出来的第一张，就是你们当天拍的。",priceLow:300,priceHigh:680,category:"体验",traits:[b.ART,b.MINIMAL],occasions:[f.BIRTH,f.ANNIV,f.MILE],recipients:[h.GF,h.BF,h.FRIEND],leadDays:7,tags:["小众","手作","一起完成"],tip:"搜本地胶片工作室的暗房开放日，四小时一场；自带一卷拍完的黑白卷效果最好。",avoid:[]},{id:"g_climb",emoji:"🧗",name:"攀岩馆入门双人体验",why:"手上会磨出印子，爬到一半会想放弃，被下面的人喊一句又上去了。运动的好玩，多半就在这种时候。",priceLow:150,priceHigh:360,category:"体验",traits:[b.SPORT,b.OUTDOOR],occasions:[f.BIRTH,f.NOREASON,f.MILE],recipients:[h.BF,h.GF,h.FRIEND,h.KID],leadDays:0,tags:["一起完成","出汗","不占地方"],tip:"选带教练的入门课，攀岩鞋和粉袋一般含在票里；提前剪指甲，别穿牛仔裤。",avoid:[]},{id:"g_cook_class",emoji:"👨‍🍳",name:"小班私厨料理课",why:"学会一道能反复做的菜，比吃一顿好饭留得久。下次他做给别人吃的时候，会顺口提一句这堂课是谁送的。",priceLow:380,priceHigh:880,category:"体验",traits:[b.COOK,b.SWEET],occasions:[f.BIRTH,f.MILE,f.NOREASON,f.FEST],recipients:mt,leadDays:3,tags:["学得会","一起完成","不占地方"],tip:"选四人以内的小班，问清能否带走成品；亚洲菜系入门比法餐更容易在家复现。",avoid:[]},{id:"g_livehouse",emoji:"🎤",name:"Livehouse 或音乐节门票",why:"站在离台三米的地方，鼓点是从胸口传过去的。散场之后走回去的那一段路，通常才是这晚最好的部分。",priceLow:200,priceHigh:800,category:"体验",traits:[b.MUSIC,b.FASHION],occasions:[f.BIRTH,f.NOREASON,f.MILE,f.ANNIV],recipients:[h.GF,h.BF,h.FRIEND],leadDays:7,tags:["现场","一起完成","不占地方"],tip:"盯着他常听的乐队巡演表，早鸟票能便宜三成；提前查场地是否全场站立。",avoid:[]},{id:"g_onsen",emoji:"♨️",name:"温泉疗养两日行程",why:"不用赶路，泡完睡一觉再泡一次。对常年绷着的人来说，能理直气壮地什么都不做，本身就是礼物。",priceLow:800,priceHigh:2600,category:"体验",traits:[b.HOME,b.OUTDOOR],occasions:[f.FEST,f.BIRTH,f.MILE,f.ANNIV],recipients:[h.PARENT,h.GF,h.BF],leadDays:14,tags:["为父母","放松","不占地方"],tip:"挑车程两小时内、含早晚餐的温泉酒店；替他们把往返交通也一并订好。",avoid:[ve.PRICEY]},{id:"g_photoshoot",emoji:"📸",name:"一次正经的全家福拍摄",why:"上一张全家合影可能已经是好几年前了。约一次认真的拍摄，把现在这个样子留下来，趁大家都还在。",priceLow:500,priceHigh:1800,category:"体验",traits:[b.HOME,b.ART],occasions:[f.FEST,f.BIRTH,f.MILE,f.ANNIV],recipients:[h.PARENT,h.KID,h.GF,h.BF],leadDays:14,tags:["为父母","可珍藏","一起完成"],tip:"选自然光棚拍或公园外景，提前统一衣服色系；一定要加洗几张实体照片。",avoid:[]},{id:"g_stargazing",emoji:"🔭",name:"城郊观星露营一晚",why:"开一小时车就能看见银河。躺在垫子上等眼睛适应黑暗的那二十分钟，往往会聊出平时说不出口的话。",priceLow:300,priceHigh:900,category:"体验",traits:[b.OUTDOOR,b.ART],occasions:[f.BIRTH,f.ANNIV,f.NOREASON],recipients:[h.GF,h.BF,h.FRIEND,h.KID],leadDays:7,tags:["户外","一起完成","不占地方"],tip:"查月相选新月前后，带够保暖衣物；跟成熟营地团比自己扎营省心得多。",avoid:[]},{id:"g_flower_class",emoji:"💐",name:"花艺工作坊",why:"亲手把一堆散枝理成型，才会明白为什么有人愿意每周买花。带回家那束能撑一周，手上的感觉留得更久。",priceLow:200,priceHigh:560,category:"体验",traits:[b.ART,b.HOME],occasions:[f.BIRTH,f.FEST,f.NOREASON,f.SORRY],recipients:[h.GF,h.FRIEND,h.PARENT],leadDays:3,tags:["手作","疗愈","一起完成"],tip:"选包花材的单次课，先问清当日花材；干花课贵一点，但成品能留很久。",avoid:[ve.SCENT,ve.DISPOSABLE]},{id:"g_massage",emoji:"💆",name:"正经理疗店的按摩次卡",why:"长期低头的人，肩背早就硬了。找一家靠谱的理疗店，一次九十分钟，比说十句「注意身体」都管用。",priceLow:300,priceHigh:800,category:"体验",traits:[b.HOME,b.SPORT],occasions:[f.NOREASON,f.FEST,f.BIRTH,f.MILE],recipients:[h.PARENT,h.WORK,h.GF,h.BF],leadDays:0,tags:["照顾","放松","为父母"],tip:"选口碑稳的连锁或医院康复科，别买超过五次的卡；顺手把第一次预约也定好。",avoid:[]},{id:"g_dessert_class",emoji:"🧁",name:"甜点手作工作坊",why:"从打发蛋白开始，失败一次再成功一次。烤箱打开的那一下最好闻，而且这次是他自己做出来的。",priceLow:260,priceHigh:580,category:"体验",traits:[b.SWEET,b.COOK],occasions:[f.BIRTH,f.FEST,f.NOREASON],recipients:[h.GF,h.FRIEND,h.KID,h.PARENT],leadDays:3,tags:["手作","甜","一起完成"],tip:"选能把全部成品带走的班，提前问清是否提供围裙和打包盒，别穿浅色衣服去。",avoid:[ve.FOOD]},{id:"g_private_cinema",emoji:"🎬",name:"私人影厅包场",why:"一整个厅只有你们两个，可以随时暂停、随便说话。挑一部他反复看过的老片，比看首映更有效。",priceLow:400,priceHigh:1e3,category:"体验",traits:[b.MUSIC,b.ART],occasions:[f.ANNIV,f.BIRTH,f.SORRY,f.NOREASON],recipients:[h.GF,h.BF,h.FRIEND],leadDays:3,tags:["现场","私密","不占地方"],tip:"不少影院有小厅包场服务，工作日下午最便宜；自备片源要提前确认格式。",avoid:[]},{id:"g_housekeeping",emoji:"🧹",name:"一整套上门保洁服务",why:"把「该大扫除了」这件事从他们的日程里直接拿掉。第一次上门你陪着，之后他们自己就会用了。",priceLow:600,priceHigh:1800,category:"体验",traits:[b.HOME,b.MINIMAL],occasions:[f.FEST,f.NOREASON,f.MILE,f.BIRTH],recipients:[h.PARENT,h.WORK],leadDays:0,tags:["为父母","实用","不占地方"],tip:"买按次计的服务包而不是年卡，先约一次深度保洁；把师傅电话存进他们手机。",avoid:[]},{id:"g_bike_trip",emoji:"🚲",name:"城市骑行或短途徒步团",why:"三十公里，走走停停，中途在某个路边摊坐下来。这类事一个人很难去做，两个人就忽然成立了。",priceLow:150,priceHigh:500,category:"体验",traits:[b.SPORT,b.OUTDOOR],occasions:[f.NOREASON,f.BIRTH,f.MILE],recipients:[h.BF,h.GF,h.FRIEND,h.KID],leadDays:3,tags:["户外","一起完成","出汗"],tip:"选有领队和补给车的成熟路线，装备可租；提前查天气，下雨就改期别硬上。",avoid:[]},{id:"g_tasting_class",emoji:"🍷",name:"一堂品鉴课（酒 / 咖啡 / 茶）",why:"学会说出「我喜欢的是哪一种」，比多喝几杯有意思得多。回家之后，他挑东西的标准就不一样了。",priceLow:300,priceHigh:800,category:"体验",traits:[b.COOK,b.MINIMAL],occasions:[f.BIRTH,f.MILE,f.NOREASON,f.FEST],recipients:[h.WORK,h.BF,h.GF,h.FRIEND],leadDays:3,tags:["学得会","品味","不占地方"],tip:"选带盲品环节的入门场，两三小时刚好；无酒精的咖啡或茶专场同样成立。",avoid:[ve.FOOD]},{id:"g_kids_science",emoji:"🔬",name:"亲子科学实验营",why:"一整天做十几个实验，回家还能复现三个。孩子记住的不是知识点，是那天有人陪他一起把东西弄坏了。",priceLow:200,priceHigh:600,category:"体验",traits:[b.TECH,b.OUTDOOR],occasions:[f.BIRTH,f.FEST,f.MILE],recipients:[h.KID],leadDays:7,tags:["为孩子","一起完成","学得会"],tip:"选六到十二岁分龄班，看清是否含可带回家的材料包；一天营比长期课更好坚持。",avoid:[]},{id:"g_theatre",emoji:"🎭",name:"一场话剧或脱口秀的前排票",why:"前排能看清演员的眼睛，也能被点到名。散场之后两个人复述同一个包袱，那晚就算是过好了。",priceLow:180,priceHigh:700,category:"体验",traits:[b.MUSIC,b.ART],occasions:[f.BIRTH,f.NOREASON,f.ANNIV,f.MILE],recipients:[h.GF,h.BF,h.FRIEND,h.PARENT],leadDays:7,tags:["现场","一起完成","开心"],tip:"开票当天就抢，前排差价其实不大；查清散场时间，顺手订好之后吃夜宵的地方。",avoid:[]},{id:"g_pt_session",emoji:"🏋️",name:"私教或普拉提入门课包",why:"一个人练最难的不是累，是不知道自己做得对不对。有人在旁边纠三次动作，习惯就容易接上了。",priceLow:400,priceHigh:1500,category:"体验",traits:[b.SPORT,b.MINIMAL],occasions:[f.BIRTH,f.MILE,f.NOREASON],recipients:[h.GF,h.BF,h.FRIEND,h.WORK],leadDays:0,tags:["出汗","学得会","不占地方"],tip:"买五到八节的小课包，别买年卡；先陪他去试一次课，教练合不合得来最关键。",avoid:[ve.PRICEY]},{id:"g_video_letter",emoji:"🎬",name:"一支三分钟的剪辑短片",why:"把这几年的照片和视频按时间顺一遍，配一首他常听的歌。三分钟很短，但看到中段大概率要停一下。",priceLow:60,priceHigh:260,category:"数字",traits:[b.MUSIC,b.ART],occasions:[f.ANNIV,f.BIRTH,f.MILE,f.SORRY],recipients:mt,leadDays:7,tags:["亲手做","可珍藏","不占地方"],tip:"用手机剪辑 App 按时间线排，控制在三分钟内；结尾留十秒黑屏字幕，别堆特效。",avoid:[]},{id:"g_song_custom",emoji:"🎼",name:"请人写一首关于你们的歌",why:"把你们的故事发过去，一周后收到一段人声小样。歌不一定多好听，但歌词里那几个名字是真的。",priceLow:500,priceHigh:1500,category:"数字",traits:[b.MUSIC,b.ART],occasions:[f.ANNIV,f.BIRTH,f.MILE],recipients:[h.GF,h.BF,h.FRIEND],leadDays:14,tags:["独一无二","可珍藏","音乐"],tip:"在音乐人接单平台找民谣向创作者，给三个具体细节，比给一堆形容词管用。",avoid:[ve.PRICEY,ve.LOUD]},{id:"g_portrait_illust",emoji:"🎨",name:"手绘插画肖像",why:"不是滤镜出来的，是有人对着照片一笔一笔画的。画里的表情，往往比照片更接近他平时的样子。",priceLow:200,priceHigh:800,category:"数字",traits:[b.ART,b.FASHION],occasions:[f.BIRTH,f.ANNIV,f.NOREASON,f.MILE],recipients:mt,leadDays:14,tags:["独一无二","可上墙","不占地方"],tip:"在插画师约稿平台按风格挑人，提供三张不同角度的清晰照；加钱可要源文件。",avoid:[]},{id:"g_playlist",emoji:"🎧",name:"一份写了注解的歌单",why:"三十首歌，每首下面写一行为什么选它。他会在某个通勤的早上，忽然听懂其中一首是在说什么。",priceLow:50,priceHigh:120,category:"数字",traits:[b.MUSIC,b.MINIMAL],occasions:[f.NOREASON,f.SORRY,f.ANNIV,f.BIRTH],recipients:mt,leadDays:0,tags:["几乎零成本","日常在听","不占地方"],tip:"在流媒体建好歌单换个封面，注解写在共享文档里，再配一张印二维码的卡片。",avoid:[]},{id:"g_ebook_gift",emoji:"📕",name:"电子书年卡加一份私人书单",why:"把他提过想读却一直没买的书一次性备齐。读书这件事最大的阻力从来不是钱，是挑书；替他挑好，事情就简单了。",priceLow:100,priceHigh:400,category:"数字",traits:[b.ART,b.MINIMAL],occasions:[f.MILE,f.BIRTH,f.NOREASON,f.FEST],recipients:mt,leadDays:0,tags:["实用","低调","不占地方"],tip:"用平台的赠送功能直接送到对方账号，附一句为什么选这几本；再挑一本做纸质版。",avoid:[]},{id:"g_course_sub",emoji:"🎓",name:"一门他一直想学的线上课",why:"想学的事往往卡在「先不急」。替他把学费付掉，再把第一节课排进日历，这件事就真的开始了。",priceLow:200,priceHigh:900,category:"数字",traits:[b.TECH,b.MINIMAL],occasions:[f.MILE,f.BIRTH,f.NOREASON],recipients:[h.WORK,h.BF,h.GF,h.FRIEND,h.KID],leadDays:0,tags:["实用","学得会","不占地方"],tip:"挑有明确产出的课程，别买泛泛的知识付费；把开课提醒一起设进他的日历。",avoid:[]},{id:"g_software_sub",emoji:"⌨️",name:"一整年的效率工具订阅",why:"每天都在用的那个软件，年费一直是他自己扛着。替他续一年，等于每天替他省掉一次犹豫。",priceLow:150,priceHigh:800,category:"数字",traits:[b.TECH,b.MINIMAL],occasions:[f.MILE,f.NOREASON,f.BIRTH],recipients:[h.WORK,h.BF,h.GF,h.FRIEND],leadDays:0,tags:["实用","低调","不占地方"],tip:"先确认他在用哪一款和注册邮箱，买礼品码送过去，别直接动他的账号设置。",avoid:[]},{id:"g_web_page",emoji:"💻",name:"一个只有一页的纪念网页",why:"域名是他的名字，打开是一段话和几张照片，往下滑还藏着彩蛋。它会一直在，也不占家里任何位置。",priceLow:60,priceHigh:300,category:"数字",traits:[b.TECH,b.ART],occasions:[f.ANNIV,f.MILE,f.BIRTH,f.NOREASON],recipients:[h.GF,h.BF,h.FRIEND,h.KID],leadDays:7,tags:["独一无二","不占地方","亲手做"],tip:"用静态托管平台免费部署，域名一年几十块；把链接做成卡片，当天再给。",avoid:[]},{id:"g_audio_diary",emoji:"🎙️",name:"一段录下来的语音信",why:"有些话写出来会被改到面目全非，说出来反而是原样。录五分钟，中间的停顿不用剪掉，那些停顿本身也是内容。",priceLow:50,priceHigh:150,category:"数字",traits:[b.MUSIC,b.HOME],occasions:[f.SORRY,f.ANNIV,f.NOREASON,f.MILE],recipients:mt,leadDays:0,tags:["几乎零成本","真诚","不占地方"],tip:"手机备忘录直接录，找个安静房间一次录完；做成二维码贴在卡片背面更有惊喜。",avoid:[]},{id:"g_game_gift",emoji:"🎮",name:"他愿望单里躺着的那款游戏",why:"在愿望单里躺了半年的那一款，多半是想要又觉得没必要。别人送过去，那点「没必要」就消失了。",priceLow:100,priceHigh:400,category:"数字",traits:[b.TECH,b.MUSIC],occasions:[f.BIRTH,f.NOREASON,f.MILE],recipients:[h.BF,h.FRIEND,h.KID,h.GF],leadDays:0,tags:["实用","低调","开心"],tip:"通过平台好友直接赠送，能附一句留言；顺手查是否在打折，省的钱可以再加一件。",avoid:[]},{id:"g_stream_list",emoji:"📺",name:"流媒体年卡加一份观影清单",why:"一年的会员，再配三十部片的清单，按心情分好类。周末不知道看什么的时候，那张清单就有用了。",priceLow:100,priceHigh:360,category:"数字",traits:[b.MUSIC,b.HOME],occasions:[f.NOREASON,f.BIRTH,f.FEST],recipients:mt,leadDays:0,tags:["实用","日常在用","不占地方"],tip:"买官方礼品卡直接充进对方账号；清单用共享文档做，留一列给他自己填。",avoid:[]},{id:"g_phone_manual",emoji:"📱",name:"给爸妈做的手机使用小抄",why:"把他们反复问的那十几个操作截图标好，字号调大打印出来。比在电话里教十遍要管用得多。",priceLow:50,priceH 把家门口变成了值得看的地方。",priceLow:300,priceHigh:900,category:"实物",traits:[b.OUTDOOR,b.MINIMAL],occasions:[f.BIRTH,f.MILE,f.NOREASON,f.FEST],recipients:[h.KID,h.PARENT,h.BF,h.FRIEND],leadDays:3,tags:["户外","为孩子","学得会"],tip:"选 8×42 规格最通用，重量控制在 700 克内；配一本本地鸟类图鉴一起送。",avoid:[]},{id:"g_moss_terrarium",emoji:"🪴",name:"苔藓生态瓶",why:"封在玻璃里的一小块森林，几乎不用管，隔几天喷一次水就行。放在桌上，视线落上去就会松一下。",priceLow:120,priceHigh:380,category:"实物",traits:[b.OUTDOOR,b.HOME],occasions:[f.NOREASON,f.BIRTH,f.FEST,f.MILE],recipients:[h.WORK,h.FRIEND,h.GF,h.KID],leadDays:3,tags:["不占地方","疗愈","低调"],tip:"选带盖的密闭款更好养，避开阳光直射；附一张三行的养护卡，别写成说明书。",avoid:[]},{id:"g_sunglasses",emoji:"🕶️",name:"复古板材太阳镜",why:"换一副镜框，整张脸的气质会跟着换。这是少数几件戴上去就能立刻看见变化的东西，试戴那一下的表情很值得看。",priceLow:260,priceHigh:900,category:"实物",traits:[b.FASHION,b.MINIMAL],occasions:[f.BIRTH,f.NOREASON,f.MILE],recipients:[h.GF,h.BF,h.FRIEND],leadDays:3,tags:["日常在用","品味","出门"],tip:"按脸型挑框：圆脸选方框，方脸选圆框；一定要选带 UV400 标识的镜片。",avoid:[ve.LOUD]},{id:"g_silk_scarf",emoji:"🧣",name:"小众设计师品牌真丝方巾",why:"图案是设计师自己画的，量少到不太会撞。系在包上或者领口，是那种别人说不出牌子却会多看一眼的东西。",priceLow:300,priceHigh:1200,category:"实物",traits:[b.FASHION,b.ART],occasions:[f.BIRTH,f.FEST,f.ANNIV,f.MILE],recipients:[h.GF,h.FRIEND,h.PARENT,h.WORK],leadDays:3,tags:["品味","小众","日常在用"],tip:"选 53cm 见方的通用尺寸，深色底更好搭；附一张三种系法的小图会更贴心。",avoid:[]},{id:"g_anc_headphone",emoji:"🎧",name:"主动降噪头戴耳机",why:"按下降噪的那一秒，通勤车厢忽然安静下来。它买的其实不是音质，是每天两段属于自己的时间。",priceLow:600,priceHigh:2200,category:"实物",traits:[b.MUSIC,b.TECH],occasions:[f.BIRTH,f.MILE,f.FEST],recipients:[h.BF,h.GF,h.WORK,h.FRIEND,h.KID],leadDays:3,tags:["日常在用","实用","音乐"],tip:"通勤为主选头戴，戴眼镜的人要试压耳感；先确认他手上不是已经有一副。",avoid:[ve.PRICEY]},{id:"g_turntable",emoji:"💿",name:"入门款黑胶唱机",why:"换面要起身，选歌要走过去。正因为麻烦，一张专辑才会被从头听到尾，而不是听三十秒就划走。",priceLow:700,priceHigh:2800,category:"实物",traits:[b.MUSIC,b.ART],occasions:[f.BIRTH,f.ANNIV,f.MILE],recipients:[h.BF,h.GF,h.FRIEND],leadDays:3,tags:["音乐","有仪式感","品味"],tip:"选带内置唱放的一体机，省一台功放；配一张他最喜欢那张专辑的正版碟。",avoid:[ve.PRICEY,ve.BULKY]},{id:"g_chef_knife",emoji:"🔪",name:"一把趁手的主厨刀",why:"刀快的时候，切菜是安静的。做饭的人第一次用到真正好的刀，通常会站在那儿多切两根胡萝卜。",priceLow:400,priceHigh:1600,category:"实物",traits:[b.COOK,b.MINIMAL],occasions:[f.MILE,f.BIRTH,f.FEST,f.NOREASON],recipients:[h.PARENT,h.BF,h.GF,h.FRIEND],leadDays:3,tags:["日常在用","实用","品味"],tip:"选 18 到 21 厘米的三德刀最通用；一定要配一块磨刀石，并教他磨一次。",avoid:[]},{id:"g_enamel_pot",emoji:"🍲",name:"铸铁珐琅炖锅",why:"小火炖两个小时，厨房里会一直有味道。这类锅重、贵、也真的能用十年，属于会被写进遗嘱的东西。",priceLow:500,priceHigh:1800,category:"实物",traits:[b.COOK,b.HOME],occasions:[f.FEST,f.MILE,f.ANNIV,f.BIRTH],recipients:[h.PARENT,h.GF,h.BF,h.FRIEND],leadDays:3,tags:["日常在用","为父母","实用"],tip:"22cm 圆锅适合两三人，再大就抬不动了；颜色挑他家厨房已有的色系。",avoid:[ve.BULKY,ve.PRICEY]},{id:"g_spice_box",emoji:"🧂",name:"世界香料地图礼盒",why:"十二个小罐，每罐配一句用法。做腻了的那几道家常菜，换一种香料就能重新变得有意思。",priceLow:160,priceHigh:420,category:"实物",traits:[b.COOK,b.ART],occasions:[f.FEST,f.NOREASON,f.BIRTH,f.MILE],recipients:[h.PARENT,h.FRIEND,h.WORK,h.GF,h.BF],leadDays:3,tags:["日常在用","学得会","低调"],tip:"选整粒而非粉状的，香气能留更久；附一张写着三道菜配方的卡片一起送。",avoid:[]},{id:"g_ereader",emoji:"📖",name:"带背光的电子墨水阅读器",why:"躺着看不刺眼，出门也不用带三本书。真正被读完的书，往往是那些随手就能翻开的，它降低的是开始读的成本。",priceLow:600,priceHigh:1600,category:"实物",traits:[b.TECH,b.ART],occasions:[f.BIRTH,f.MILE,f.FEST],recipients:[h.WORK,h.BF,h.GF,h.FRIEND,h.PARENT],leadDays:3,tags:["日常在用","实用","不占地方"],tip:"六到七寸单手能握最实用；提前把他想读的十本书导进去，开机就能看。",avoid:[ve.PRICEY]},{id:"g_keyboard",emoji:"⌨️",name:"手感安静的机械键盘",why:"每天要敲几千下的东西，值得比显示器更认真地挑。换掉那把用了五年的旧键盘，工作日会好过一点。",priceLow:300,priceHigh:1200,category:"实物",traits:[b.TECH,b.MINIMAL],occasions:[f.MILE,f.BIRTH,f.NOREASON],recipients:[h.WORK,h.BF,h.GF,h.FRIEND],leadDays:3,tags:["日常在用","实用","低调"],tip:"办公场景选静音红轴，别买声音大的青轴；68 配列比全尺寸更省桌面。",avoid:[]},{id:"g_portable_monitor",emoji:"🖥️",name:"便携副屏显示器",why:"出差时在酒店摊开就是两块屏。它解决的不是酷不酷，是每天多出来的那一个小时，用过之后基本回不去单屏。",priceLow:600,priceHigh:1800,category:"实物",traits:[b.TECH,b.MINIMAL],occasions:[f.MILE,f.BIRTH,f.NOREASON],recipients:[h.WORK,h.BF,h.GF,h.FRIEND],leadDays:3,tags:["实用","日常在用","低调"],tip:"选 15.6 寸、单线供电的款，重量控制在 800 克内；顺手配一个立式收纳包。",avoid:[ve.PRICEY]},{id:"g_charging_dock",emoji:"🔋",name:"桌面多口充电站",why:"把桌上那团缠死的线一次性收掉。它不会被人夸，但每天早上都会让人少一件烦躁的事，好东西常常就是这种不响的。",priceLow:150,priceHigh:500,category:"实物",traits:[b.TECH,b.MINIMAL],occasions:[f.NOREASON,f.MILE,f.BIRTH,f.FEST],recipients:[h.WORK,h.BF,h.GF,h.FRIEND,h.PARENT],leadDays:0,tags:["实用","低调","不占地方"],tip:"按他的设备数选口数，氮化镓的更小；配三根合适长度的编织线一起送。",avoid:[]},{id:"g_bp_monitor",emoji:"🩺",name:"会自动记录的家用血压计",why:"爸妈量完就忘，医生问起来又说不清楚。数据自动存进手机，你在外地也能顺手看一眼，这份安心其实是给两边的。",priceLow:200,priceHigh:700,category:"实物",traits:[b.HOME,b.TECH],occasions:[f.FEST,f.NOREASON,f.BIRTH],recipients:[h.PARENT],leadDays:0,tags:["为父母","照顾","实用"],tip:"选上臂式而不是腕式，测得准；帮他们把 App 绑定好，第一周陪着量几次。",avoid:[]},{id:"g_neck_massager",emoji:"💺",name:"颈肩理疗按摩仪",why:"他们不会为自己买这类东西，总觉得忍忍就过去了。放在沙发扶手边，坐下来就顺手用上了，试一周就知道离不离得开。",priceLow:300,priceHigh:1e3,category:"实物",traits:[b.HOME,b.SPORT],occasions:[f.FEST,f.BIRTH,f.NOREASON,f.MILE],recipients:[h.PARENT,h.WORK,h.BF,h.GF],leadDays:0,tags:["为父母","照顾","实用"],tip:"挑加热加揉捏、有定时断电的款；买回来先自己用一次，再教他们怎么调档。",avoid:[ve.BULKY]},{id:"g_desk_plant",emoji:"🌿",name:"几乎养不死的桌面绿植",why:"工位上有一点活的东西，会明显不一样。挑那种忘记浇水两周也没事的，才不会变成负担。",priceLow:60,priceHigh:180,category:"实物",traits:[b.HOME,b.MINIMAL],occasions:[f.NOREASON,f.MILE,f.FEST,f.BIRTH],recipients:[h.WORK,h.FRIEND,h.PARENT],leadDays:0,tags:["不越界","低调","不占地方"],tip:"虎尾兰或镜面草都很耐活；换一个素色陶盆，比原来的塑料盆体面很多。",avoid:[]},{id:"g_drip_coffee_box",emoji:"☕",name:"精品挂耳咖啡礼盒",why:"分量刚好，价格不重，收下不需要考虑要不要还。工位上每天撕开一包，会记起是谁给的。",priceLow:80,priceHigh:220,category:"实物",traits:[b.COOK,b.MINIMAL],occasions:[f.FEST,f.NOREASON,f.MILE,f.BIRTH],recipients:[h.WORK,h.FRIEND,h.PARENT,h.BF,h.GF],leadDays:0,tags:["不越界","低调","日常在用"],tip:"选烘焙日期在两周内的，混合三种产地更有得聊；避开速溶和调味豆。",avoid:[ve.FOOD,ve.DISPOSABLE]},{id:"g_pen_notebook",emoji:"🖊️",name:"一支好写的签字笔配皮质本",why:"开会时掏出来的那两样东西，其实一直在替人说话。这是同事之间少数不会越界的体面礼物。",priceLow:200,priceHigh:700,category:"实物",traits:[b.MINIMAL,b.ART],occasions:[f.MILE,f.FEST,f.BIRTH,f.NOREASON],recipients:[h.WORK,h.BF,h.FRIEND,h.PARENT],leadDays:3,tags:["不越界","低调","日常在用"],tip:"笔选德系细杆黑色，本子选可平摊的；笔身刻名字要问清楚，有人不喜欢。",avoid:[]},{id:"g_wood_blocks",emoji:"🧸",name:"大颗粒实木建构积木",why:"没有说明书，也没有正确答案。孩子搭到第三次会开始自己定规则，那时候大人插不上话最好。",priceLow:200,priceHigh:700,category:"实物",traits:[b.MINIMAL,b.ART],occasions:[f.BIRTH,f.FEST,f.MILE,f.NOREASON],recipients:[h.KID],leadDays:3,tags:["为孩子","一起完成","可珍藏"],tip:"选无漆原木、通过安全认证的；配一个布袋收纳，比纸盒耐用得多。",avoid:[ve.BULKY]},{id:"g_kid_camera",emoji:"📷",name:"孩子能自己按快门的相机",why:"把镜头交出去，你会看到一个完全不同高度的世界。他拍的第一卷多半糊，但值得洗出来贴满一面墙。",priceLow:300,priceHigh:900,category:"实物",traits:[b.ART,b.TECH],occasions:[f.BIRTH,f.FEST,f.MILE],recipients:[h.KID],leadDays:3,tags:["为孩子","开心","可珍藏"],tip:"拍立得耗材贵，长期玩选儿童数码相机；先陪他拍完第一张，再放手。",avoid:[]},{id:"g_home_wear",emoji:"🧦",name:"好穿到不想脱的家居服",why:"一个人在家穿什么，其实决定了那几个小时的松弛程度。这类东西自己很少舍得买，收到却天天在穿。",priceLow:260,priceHigh:800,category:"实物",traits:[b.HOME,b.FASHION],occasions:[f.FEST,f.BIRTH,f.NOREASON,f.ANNIV],recipients:[h.GF,h.BF,h.PARENT,h.FRIEND],leadDays:3,tags:["日常在用","照顾","低调"],tip:"选莫代尔或双层纱，尺码宁大一码；深色系更实穿，避开容易起球的绒面。",avoid:[]},{id:"g_travel_backpack",emoji:"🎒",name:"通勤加短途两用背包",why:"一个能塞下电脑又不显得像出差的包，能同时解决上班和周末两件事。用坏之前会被背很多年。",priceLow:400,priceHigh:1300,category:"实物",traits:[b.FASHION,b.MINIMAL],occasions:[f.MILE,f.BIRTH,f.FEST],recipients:[h.WORK,h.BF,h.GF,h.FRIEND,h.KID],leadDays:3,tags:["日常在用","实用","出门"],tip:"容量 20 到 25 升最通用，要有独立笔电仓和侧开口；颜色别选亮色。",avoid:[]},{id:"g_speaker",emoji:"🔈",name:"床头用的小型蓝牙音箱",why:"睡前放一点声音，房间就不那么空。它不追求音质发烧，只负责把一天的最后半小时铺满。",priceLow:260,priceHigh:900,category:"实物",traits:[b.MUSIC,b.HOME],occasions:[f.BIRTH,f.NOREASON,f.FEST,f.MILE],recipients:[h.GF,h.BF,h.FRIEND,h.KID,h.PARENT],leadDays:0,tags:["日常在用","音乐","不占地方"],tip:"选带氛围灯和定时关机的款；开箱前先连好蓝牙，放上他喜欢的那首再递过去。",avoid:[]},{id:"g_stayin_kit",emoji:"🧺",name:"「这个周末不用出门」包",why:"一条盖毯、两包好豆子、一张手写的六部片清单。它不解决任何问题，只把周末从待办里赎回来。",priceLow:300,priceHigh:800,category:"组合",traits:[b.HOME,b.SWEET],occasions:[f.NOREASON,f.BIRTH,f.FEST,f.SORRY],recipients:[h.GF,h.BF,h.FRIEND,h.PARENT],leadDays:3,tags:["照顾","日常在用","一起完成"],tip:"装进一个能反复用的藤篮，别用礼盒；清单写在纸上，比发链接更有分量。",avoid:[]},{id:"g_commute_kit",emoji:"💼",name:"通勤减负三件套",why:"一副降噪耳机、一个保温杯、一条短线。三样都不起眼，合起来能把每天两小时的路变得像样一点。",priceLow:400,priceHigh:1200,category:"组合",traits:[b.TECH,b.MINIMAL],occasions:[f.MILE,f.BIRTH,f.FEST,f.NOREASON],recipients:[h.WORK,h.BF,h.GF,h.FRIEND],leadDays:3,tags:["实用","低调","日常在用"],tip:"按他现在最缺的那一样定预算，另外两样从简；全部先拆封充好电再送。",avoid:[]},{id:"g_herb_garden",emoji:"🌱",name:"阳台香草小花园套装",why:"罗勒、薄荷、迷迭香各一盆，做菜时伸手就能掐一把。养活一株植物这件事，会让人对家更上心一点。",priceLow:120,priceHigh:400,category:"组合",traits:[b.OUTDOOR,b.COOK],occasions:[f.NOREASON,f.FEST,f.BIRTH,f.MILE],recipients:[h.PARENT,h.KID,h.GF,h.FRIEND],leadDays:3,tags:["一起完成","日常在用","疗愈"],tip:"买带根的苗而不是种子，成活率高很多；配一把小剪刀和三张用法卡片。",avoid:[]},{id:"g_hometown_box",emoji:"🍱",name:"家乡味道食材箱加一张菜单",why:"寄一箱只有那边才买得到的东西，附上你写的做法。他们做的时候会一直念叨，这是谁大老远寄回来的。",priceLow:200,priceHigh:700,category:"组合",traits:[b.COOK,b.HOME],occasions:[f.FEST,f.NOREASON,f.BIRTH],recipients:[h.PARENT,h.FRIEND],leadDays:7,tags:["为父母","日常在用","照顾"],tip:"避开需要冷冻的品类，干货更稳妥；菜单手写后拍照打印，原件也一起塞进去。",avoid:[ve.FOOD]},{id:"g_twelve_letters",emoji:"💌",name:"「一年十二封信」订阅盒",why:"十二个信封写好月份，约定每月初拆一封。礼物只送一次，但这件事会在往后一年里持续发生。",priceLow:100,priceHigh:320,category:"组合",traits:[b.ART,b.HOME],occasions:[f.ANNIV,f.BIRTH,f.MILE,f.SORRY],recipients:[h.GF,h.BF,h.FRIEND,h.KID,h.PARENT],leadDays:7,tags:["有仪式感","几乎零成本","手作"],tip:"每封写不同的主题，别都写想念；里面各夹一件小东西，票根或者干花都行。",avoid:[]},{id:"g_run_starter",emoji:"🏃",name:"晨跑启动包",why:"一个跑步腰包、一双压缩袜、一张贴在冰箱上的八周计划表。装备只占一半，另一半是那张表。",priceLow:200,priceHigh:600,category:"组合",traits:[b.SPORT,b.MINIMAL],occasions:[f.MILE,f.NOREASON,f.BIRTH],recipients:[h.BF,h.GF,h.FRIEND,h.WORK],leadDays:3,tags:["运动","实用","学得会"],tip:"计划表从每周三次、每次二十分钟起；第一周你陪着跑，成功率会翻倍。",avoid:[]},{id:"g_latenight_kit",emoji:"🌙",name:"「一个人的深夜」包",why:"一副有线耳机、一张实体专辑、一盒助眠的茶。给那种加班到很晚、回家还不想立刻睡的人。",priceLow:260,priceHigh:700,category:"组合",traits:[b.MUSIC,b.HOME],occasions:[f.NOREASON,f.BIRTH,f.MILE,f.SORRY],recipients:[h.BF,h.GF,h.FRIEND,h.WORK],leadDays:3,tags:["照顾","音乐","低调"],tip:"专辑选他常听的那张实体版；茶要无咖啡因，附一句「不用回消息」的卡片。",avoid:[]},{id:"g_dessert_night",emoji:"🧁",name:"甜品之夜套装",why:"一套模具、三张配方卡、一条围裙。周五晚上把厨房弄得一团糟，第二天早上还有东西可以吃。",priceLow:200,priceHigh:560,category:"组合",traits:[b.SWEET,b.COOK],occasions:[f.BIRTH,f.FEST,f.NOREASON,f.ANNIV],recipients:[h.GF,h.FRIEND,h.KID,h.BF],leadDays:3,tags:["一起完成","甜","开心"],tip:"配方卡只选三道零失败的，别写进阶款；模具挑不粘且能进洗碗机的。",avoid:[ve.FOOD]},{id:"g_newjob_kit",emoji:"🗃️",name:"「新岗位第一天」套装",why:"一支好笔、一本空白本、一张够用一个月的咖啡券。它说的是：这一步我看见了，也当回事。",priceLow:200,priceHigh:600,category:"组合",traits:[b.MINIMAL,b.TECH],occasions:[f.MILE,f.NOREASON,f.FEST],recipients:[h.WORK,h.FRIEND,h.BF,h.GF],leadDays:3,tags:["不越界","实用","低调"],tip:"别刻公司名，刻他自己的名字；卡片上写一句具体的祝贺，别写套话。",avoid:[]},{id:"g_school_kit",emoji:"🎒",name:"开学装备包",why:"书包、水壶、一盏护眼台灯，再加一本写着名字的记事本。开学前一晚摊在桌上，孩子会自己整理到很晚。",priceLow:300,priceHigh:900,category:"组合",traits:[b.MINIMAL,b.TECH],occasions:[f.MILE,f.FEST,f.BIRTH],recipients:[h.KID],leadDays:7,tags:["为孩子","实用","日常在用"],tip:"书包要试背，肩带宽的护脊款优先；台灯认准无频闪，色温可调更好。",avoid:[]},{id:"g_sleep_kit",emoji:"😴",name:"助眠仪式盒",why:"真丝眼罩、一小瓶枕头喷雾、一台白噪音机。睡不好的人缺的不是困意，是一套告诉身体该收工的流程。",priceLow:260,priceHigh:700,category:"组合",traits:[b.HOME,b.MINIMAL],occasions:[f.NOREASON,f.BIRTH,f.FEST,f.MILE],recipients:[h.GF,h.BF,h.PARENT,h.FRIEND,h.WORK],leadDays:3,tags:["照顾","疗愈","日常在用"],tip:"喷雾选薰衣草以外的清淡香型，很多人对薰衣草无感；白噪音机要能定时关。",avoid:[ve.SCENT]},{id:"g_weekend_trip",emoji:"✈️",name:"一次已经订好的周末出走",why:"车票、住处、两个必去的地方，全都替他定好了。最难的从来不是想去，是终于有人把日期填上。",priceLow:900,priceHigh:3600,category:"组合",traits:[b.OUTDOOR,b.FASHION],occasions:[f.ANNIV,f.BIRTH,f.MILE,f.NOREASON],recipients:[h.GF,h.BF,h.FRIEND,h.PARENT],leadDays:14,tags:["一起完成","出门","有仪式感"],tip:"行程只排两个必去点，其余留白；把车票和入住信息打印成一张卡片再给。",avoid:[ve.PRICEY]},{id:"g_parents_health",emoji:"🏥",name:"父母年度体检套餐加陪同",why:"他们不是不想查，是嫌麻烦也怕花钱。你把项目选好、时间约好、当天陪着去，这件事才真的会发生。",priceLow:800,priceHigh:2600,category:"组合",traits:[b.HOME,b.MINIMAL],occasions:[f.FEST,f.BIRTH,f.NOREASON,f.MILE],recipients:[h.PARENT],leadDays:14,tags:["为父母","照顾","实用"],tip:"选含心脑血管和肿瘤标志物的中老年套餐；空腹项目约在上午，当天请假陪着去。",avoid:[ve.PRICEY]}],Xr={[h.GF s:["就这样。{recipient}笑出声我就算收工，感动这种高级情绪今天先不追求，我们下次再走深刻路线。","不用感动，也不用说谢谢，笑一下就够本了。真想谢我，下次轮到{recipient}想办法把我逗笑。","下次继续，素材我还有很多。这些年攒下来的那些段子，大概够我们一直用到明年这个时候。","好了，正经话就说这么多。祝{recipient}今天顺顺利利，最好一整天都没有烦人的事找上门。"],fillers:["真的，我很认真。","别拆穿我。","你懂我意思吧。","我自己写着都笑了。","认真的，只有一点点。","总之就是这样。"]}},Pg={"甜蜜期，怎么送都开心":["现在这样很好，好到我有点想让时间走慢一些。","最近每天都挺高兴的，这份高兴里有很大一部分是你给的。","我们现在的状态，我很喜欢，也很想守住。"],"稳定期，想制造一点新鲜感":["在一起久了，很多事变成了习惯。习惯没什么不好，只是偶尔也该有点新的。","日子过得越来越顺，我却不想让它顺到没有惊喜。所以有了这次。","熟悉是好事，但我不想我们只剩下熟悉。"],"有点疏远，想拉近一点":["这段时间我们各自都忙，话说得少了。我想把这件事往回拉一点。","我知道最近有点淡，不是谁的错。只是我不想就这样滑过去。","有段时间没好好说话了。这封信算是我先开口。"],"刚和好 / 想弥补":["前段时间的事，我想过很多次。有些话当时没说好，现在补上。","道歉说过了，但我觉得只说不够。所以有了这一次。","过去的那一页我们翻过去了，剩下的我想做得比说得多。"]},Bg=[{key:"playful",label:"俏皮",keys:["俏皮","轻松","幽默","搞笑","有梗","活泼"],salutationSuffix:"：",extra:["这段就当我在你耳边说的，语气自动调轻一点。","严肃的部分我留到最后一段，先这样。"]},{key:"solemn",label:"郑重",keys:["郑重","正式","认真","庄重","诚恳"],salutationSuffix:"：",extra:["这些话我斟酌过，不是随手写的。","我希望这封信被认真读一遍，哪怕只读一遍。"]},{key:"restrained",label:"克制",keys:["克制","简短","平静","淡","收敛"],salutationSuffix:"：",extra:["能少说的地方我都少说了。","剩下的，留给你自己去感觉。"]},{key:"ardent",label:"热烈",keys:["热烈","深情","浓","直白","炽热"],salutationSuffix:"：",extra:["我不打算含蓄，这次就想说得满一点。","有些话说轻了反而不像真的。"]},{key:"warm",label:"温暖",keys:["温暖","日常","平实","朴素","家常"],salutationSuffix:"：",extra:["写这些的时候我在想很普通的画面。","就是些家常话，但都算数。"]}],ta={[at.RUSH]:[{time:"现在",title:"先把礼物锁定",desc:"挑一件今天就能拿到手的，别再纠结有没有更好的。能按时送出，永远优于更完美。"},{time:"今天下午",title:"自己跑一趟取货",desc:"尽量当面挑一次，顺手在店里要一张干净的包装纸。摸过实物，递出去时你会更笃定。"},{time:"今晚",title:"手写那张卡片",desc:"照着信抄一遍，写错就划掉重写。划痕不用怕，那正是没有复制粘贴过的证据。"},{time:"见面前 1 小时",title:"把手机收起来",desc:"提前到，把要说的第一句在心里过一遍。别彩排太多，留一点会卡住的余地。"},{time:"递出的那一刻",title:"先说，再给",desc:"先讲一句为什么是这件东西，再把它拿出来。顺序反过来，效果会差一半。"},{time:"拆开之后",title:"别急着解释",desc:"让对方自己看几秒。中间的沉默不是冷场，是他正在反应过来。"},{time:"当天晚上",title:"补一条消息",desc:"回到家发一句今天没说完的话。当面讲不出口的，文字里往往更容易落地。"}],[at.WEEK]:[{time:"今天",title:"定下主线，别再改",desc:"从三件里选出真正的那一件，其余两件作为陪衬。方案越简单，执行越不会出错。"},{time:"第 2 天",title:"下单并确认到货时间",desc:"下单后直接问客服最晚到货日，把它记进日历。留出两天缓冲，物流不讲道理。"},{time:"第 3 天",title:"写信的初稿",desc:"先不管好不好，一次写完不要回头改。放两天再看，多余的句子会自己浮出来。"},{time:"第 5 天",title:"把当天的地点定好",desc:"选一个安静、不用抢座、可以坐久一点的地方。环境嘈杂会毁掉一半的效果。"},{time:"前一天",title:"包装并预演一次",desc:"自己包，允许有点手工感。对着镜子把开场那句说一遍，别超过三句。"},{time:"当天",title:"把节奏放慢",desc:"先吃饭、先聊天，礼物放在最后。前面铺得越平常，后面那一下越有分量。"},{time:"当天晚些时候",title:"留一张合影",desc:"不用摆拍，随手拍一张就好。半年后你们会需要这张照片来指认这一天。"},{time:"第二天",title:"把余温接住",desc:"第二天再发一句昨天的后续。多数感动死在第二天没有下文。"}],[at.FEW_WEEKS]:[{time:"第 1 周初",title:"确定唯一的主线",desc:"把想到的所有点子写下来，只留一条能一句话说清的。剩下的都是配菜。"},{time:"第 1 周内",title:"下定制单，锁定工期",desc:"定制类最容易翻车在工期上。下单时白纸黑字问清成品日期，并要求提前三天完成。"},{time:"第 2 周",title:"悄悄收集素材",desc:"需要照片、录音或旧物的，趁现在收齐。找共同好友帮忙时，先说清楚要保密。"},{time:"第 2 周末",title:"写信，然后放几天",desc:"一口气写完，先别修。搁三天再读，你会知道哪几句是写给自己看的。"},{time:"第 3 周",title:"确认到货与备用方案",desc:"催一次进度，同时想好万一延期怎么办。有 B 计划的人当天不会慌。"},{time:"提前 3 天",title:"把当天流程走一遍",desc:"几点见面、在哪儿给、谁先说话，都想清楚。写在备忘录里，当天只需照做。"},{time:"前一天",title:"包装并检查细节",desc:"刻字有没有错别字、卡片有没有落款、电池装了没有，一样一样过。"},{time:"当天",title:"分两次给",desc:"先给信，等对方读完再拿出礼物。中间那几分钟的安静，是整件事最值钱的部分。"}],[at.LONG]:[{time:"第 1 周",title:"先做减法",desc:"时间充裕最容易堆料。列完清单后只留一条主线，其余的忍住不加。"},{time:"第 2 周",title:"启动定制或预约",desc:"手作、刻字、拍摄这类都要排期，越早越有选择权。定金付了就别再改方案。"},{time:"第 3 周",title:"开始攒素材",desc:"照片、聊天记录、票根，看到就存进一个文件夹。到后期再翻会来不及。"},{time:"第 4 周",title:"写信初稿，然后搁置",desc:"写完锁进抽屉两周。再打开时，你会一眼看出哪些是套话。"},{time:"提前 2 周",title:"确认所有工期",desc:"把每一件的完成日期核一遍，全部提前一周。留出的空档就是你的安全感。"},{time:"提前 1 周",title:"把当天的行程订好",desc:"餐厅、交通、备用室内点，全部落实。天气和堵车是这类计划最大的敌人。"},{time:"提前 3 天",title:"试运行一次",desc:"包装拆开再包一次，设备充满电，卡片写好收进内袋。当天不要有任何第一次。"},{time:"当天",title:"按写好的流程走",desc:"不要临场加戏。你准备了一个月，此刻唯一要做的就是相信当初的判断。"}]},Rn={relationLead:{[gs.GF]:["你们之间不缺日常，缺的是一次被郑重对待的时刻。","在一起久了，最容易被跳过的恰恰是「说清楚」这一步。","这不是一次表白，而是一次确认——确认你一直在认真看着她。"],[gs.BF]:["他习惯把需求藏起来，所以更需要有人替他先看出来。","男生之间很少互相送礼物，这正是这份心意会被记住的原因。","与其猜他缺什么，不如从他反复提起的那件事下手。"],[gs.PARENT]:["父母那一辈的表达方式是「不用麻烦」，翻译过来是「我不好意思要」。","他们缺的从来不是东西，是被当作一个具体的人来对待。","给父母送礼最难的一点，是既要用得上，又不能让他们心疼钱。"],[gs.FRIEND]:["好友之间的默契在于分寸——太重会尴尬，太轻显得敷衍。","你们之间不需要解释，所以礼物本身就该带着只有你俩懂的信息。","朋友这一层关系没有节日保护，所以主动才更显得珍贵。"],[gs.WORK]:["
